// ════════════════════════════════════════════════════════════════
//  app/build.gradle — Grey Corner Serveurs
// ════════════════════════════════════════════════════════════════
//
//  CHANGEMENTS PAR RAPPORT À L'ANCIEN FICHIER :
//  ─────────────────────────────────────────────
//  1. Plugin Google Services ajouté (ligne plugins)
//  2. Firebase BOM 33.5.1 ajouté
//  3. firebase-messaging 24.0.1 ajouté (FCM HIGH PRIORITY)
//  4. firebase-auth et firebase-firestore en option commentée
//     (non requis — l'auth se fait en REST dans WaiterForegroundService)
//
//  PRÉREQUIS OBLIGATOIRE AVANT LE BUILD :
//  ────────────────────────────────────────
//  1. Aller sur https://console.firebase.google.com/
//  2. Projet : grey-corner-restaurant
//  3. Project Settings → Ajouter une application Android
//  4. Package name : com.menugreycorner
//  5. Télécharger google-services.json
//  6. Placer google-services.json dans : app/google-services.json
//
//  Sans ce fichier, le build échoue avec :
//  "File google-services.json is missing"
// ════════════════════════════════════════════════════════════════

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'   // ← NOUVEAU : requis pour Firebase
}

android {
    namespace "com.menugreycorner"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.menugreycorner"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    // Support libraries
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'

    // ── Firebase BOM (gère les versions de tous les modules Firebase) ──
    // Le BOM garantit la compatibilité entre les modules Firebase.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')

    // Firebase Cloud Messaging — système principal de notification
    // HIGH PRIORITY : fonctionne app tuée, écran éteint, Doze mode
    implementation 'com.google.firebase:firebase-messaging'

    // ── Modules optionnels (décommenter si besoin) ─────────────────────
    // Firebase Auth (alternative SDK au REST auth manuel dans le service)
    // implementation 'com.google.firebase:firebase-auth'

    // Firebase Firestore (alternative SDK au polling REST manuel)
    // implementation 'com.google.firebase:firebase-firestore'
}
